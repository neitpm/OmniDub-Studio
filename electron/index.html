<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>OmniDub Studio</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#243044; --tx:#dce6f2; --dim:#8496ad; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
  .wrap { padding:16px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:17px; margin:0; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { background:#22304a; color:var(--tx); border:1px solid #33456a; border-radius:8px;
           padding:9px 13px; font-size:13px; cursor:pointer; }
  button:hover:not(:disabled) { background:#2c3d5e; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#2f6df0; border-color:#2f6df0; font-weight:600; padding:12px 16px; }
  button.primary:hover:not(:disabled) { background:#4a82ff; }
  button.warn { background:#5a2f2f; border-color:#7a3d3d; }
  .svc { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .svc:last-child { border-bottom:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:#5a6473; flex:none; }
  .dot.ok { background:#31d17b; box-shadow:0 0 8px #31d17b80; }
  .dot.bad { background:#ff5f6d; }
  .dot.wait { background:#f0b52f; }
  .nm { font-weight:600; font-size:13px; }
  .lb { color:var(--dim); font-size:12px; }
  .st { margin-left:auto; font-size:12px; color:var(--dim); }
  .st a { color:#79aaff; cursor:pointer; text-decoration:none; }
  #log { background:#0a0e16; border:1px solid var(--line); border-radius:8px; padding:10px;
         height:190px; overflow:auto; font:12px/1.5 Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
  #log .err { color:#ff8b93; } #log .ok { color:#5ee0a0; } #log .warn { color:#f0c674; }
  #log .raw { color:#9fb3c8; } #log .info { color:#cfe0f2; }
  .kv { color:var(--dim); font-size:12px; }
  .grow { flex:1; }
  input[type=text] { background:#0f1522; border:1px solid var(--line); color:var(--tx);
                     border-radius:6px; padding:6px 8px; font-size:12px; flex:1; }
  label.chk { font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>OmniDub Studio</h1>
    <div class="sub">Bấm một nút là chạy — không cần mở cmd, không cần gõ lệnh. <span id="dock" class="kv"></span></div>
  </div>

  <div class="card row">
    <button class="primary" id="go">▶ Khởi động hệ thống</button>
    <button id="open" disabled>🎬 Mở Studio</button>
    <span class="grow"></span>
    <span id="count" class="kv">đang kiểm tra…</span>
  </div>

  <div class="card" id="svcs"></div>

  <div class="card row">
    <button id="rebuild">🔁 Rebuild video-service</button>
    <button id="prune" class="warn">🧹 Dọn build cache</button>
    <button id="stop" class="warn">⏹ Dừng toàn bộ</button>
    <button id="folder">📁 Mở thư mục output</button>
  </div>

  <div class="card">
    <div class="row">
      <span class="lb">Thư mục dự án</span>
      <input type="text" id="repo" readonly>
      <button id="pick">Đổi…</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chk"><input type="checkbox" id="auto"> Tự mở Studio khi khởi động xong</label>
    </div>
  </div>

  <div class="card">
    <div class="lb" style="margin-bottom:6px">Nhật ký</div>
    <div id="log"></div>
    <div class="row" style="margin-top:8px"><button id="clear">Xóa nhật ký</button></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n }
let up = 0

function logLine (d) {
  const box = $('log')
  const time = new Date(d.t).toLocaleTimeString('vi-VN', { hour12: false })
  box.appendChild(el('div', d.level, time + '  ' + String(d.text).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))))
  while (box.children.length > 400) box.removeChild(box.firstChild)
  box.scrollTop = box.scrollHeight
}

function render (st) {
  $('svcs').innerHTML = ''
  up = 0
  for (const s of st.services) {
    const row = el('div', 'svc')
    const dot = el('div', 'dot')
    if (s.state === 'running') { up++; dot.classList.add(s.http ? 'ok' : 'wait') } else if (s.state === 'exited') dot.classList.add('bad')
    row.appendChild(dot)
    row.appendChild(el('div', 'nm', s.name.replace('translate-', '')))
    row.appendChild(el('div', 'lb', s.label + ' · :' + s.port))
    const stx = el('div', 'st')
    const map = { running: s.http ? 'đang chạy' : 'lắng nghe', exited: 'đã dừng', absent: 'chưa tạo', created: 'đã tạo' }
    stx.textContent = (map[s.state] || s.state) + ' '
    const a = el('a', null, 'log')
    a.onclick = () => window.api.logs(s.name)
    stx.appendChild(a)
    row.appendChild(stx)
    $('svcs').appendChild(row)
  }
  $('count').textContent = up + '/5 service' + (up === 5 ? ' — sẵn sàng' : '')
  $('dock').textContent = st.docker ? '· Docker ' + st.docker : '· Docker chưa chạy'
  $('open').disabled = up === 0
  $('go').disabled = up === 5
  $('go').textContent = up === 5 ? '✔ Hệ thống đang chạy' : '▶ Khởi động hệ thống'
  $('repo').value = st.repo
}

window.api.onLog(logLine)
window.api.onStatus(render)

$('go').onclick = () => { logLine({ text: 'Đang khởi động… (lần đầu có thể mất 1-3 phút để Docker Desktop dậy)', level: 'info', t: Date.now() }); window.api.start() }
$('open').onclick = () => window.api.studio()
$('stop').onclick = () => window.api.stop()
$('rebuild').onclick = () => { logLine({ text: 'Rebuild video-service — 4 service kia không bị khởi động lại', level: 'info', t: Date.now() }); window.api.rebuild() }
$('prune').onclick = () => window.api.prune()
$('folder').onclick = () => window.api.openRepo()
$('clear').onclick = () => { $('log').innerHTML = '' }
$('pick').onclick = async () => { const p = await window.api.pickRepo(); $('repo').value = p }
$('auto').onchange = (e) => window.api.settings({ autoOpenStudio: e.target.checked })

;(async () => {
  const st = await window.api.status(); render(st)
  const s = await window.api.settings({}); $('auto').checked = s.autoOpenStudio !== false
})()
setInterval(() => window.api.status().then(render), 8000)
</script>
</body>
</html>
